<nav class="navbar navbar-expand-lg toy-navbar">
  <div class="container">
    <!-- Brand Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/home" (click)="closeMobileMenu()">
      <span class="brand-icon-wrapper">
        <img src="assets/logo.jpeg" alt="Logo de Hola Juguetes">
      </span>
      <span class="brand-title">Hola Juguetes</span>
    </a>

    <!-- Mobile Menu Button -->
    <button
      class="navbar-toggler custom-toggler border-0 shadow-none"
      type="button"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Alternar navegación"
    >
      <i class="bi" [ngClass]="isMobileMenuOpen ? 'bi-x-lg' : 'bi-list'"></i>
    </button>

    <!-- Navigation Content -->
    <div class="collapse navbar-collapse" [ngClass]="{ 'show': isMobileMenuOpen }">
      <!-- Main Links -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 nav-main-links">
        <li class="nav-item">
          <a class="nav-link nav-link-custom" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMobileMenu()">
            <i class="bi bi-house-door me-1"></i> Inicio
          </a>
        </li>
        <li class="nav-item" *ngIf="showAdminBoard">
          <a class="nav-link nav-link-custom badge-nav admin-nav" routerLink="/dashboard" routerLinkActive="active" (click)="closeMobileMenu()">
            <i class="bi bi-shield-lock me-1"></i> Panel Admin
          </a>
        </li>
        <li class="nav-item" *ngIf="showSellerBoard">
          <a class="nav-link nav-link-custom badge-nav seller-nav" routerLink="/movimientos/registrar" routerLinkActive="active" (click)="closeMobileMenu()">
            <i class="bi bi-box-arrow-in-down me-1"></i> Registrar movimiento
          </a>
        </li>
      </ul>

      <!-- Right Side: Auth / Profile -->
      <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
        <ng-container *ngIf="!isLoggedIn">
          <li class="nav-item">
            <a class="btn toy-nav-btn-secondary w-100" routerLink="/login" (click)="closeMobileMenu()">
              <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </a>
          </li>
          <li class="nav-item">
            <a class="btn toy-nav-btn-primary w-100" routerLink="/register" (click)="closeMobileMenu()">
              <i class="bi bi-person-plus me-1"></i> Registrarse
            </a>
          </li>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <li class="nav-item">
            <a class="user-profile-badge" routerLink="/profile" (click)="closeMobileMenu()" title="Ver Mi Perfil">
              <span class="user-avatar-circle">
                <i class="bi bi-person-fill"></i>
              </span>
              <span class="user-name-text">{{ username }}</span>
            </a>
          </li>
          <li class="nav-item">
            <button class="btn btn-logout" (click)="logout(); closeMobileMenu()" title="Cerrar Sesión">
              <i class="bi bi-box-arrow-right me-1"></i>
              <span>Salir</span>
            </button>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
