<main class="seller-page">
  <section class="seller-header"><div><span class="eyebrow">Operación rápida</span><h1>Registrar movimiento</h1><p>Registra varias líneas bajo la misma factura o ticket.</p></div><div class="reference-card" [class.ticket]="type === 'SALIDA'"><span>Referencia activa</span><strong>{{ activeReference || 'Cargando...' }}</strong></div></section>
  <section class="type-switch" aria-label="Tipo de movimiento"><button [class.selected]="type === 'ENTRADA'" (click)="setType('ENTRADA')"><i class="bi bi-arrow-down-left"></i> Entrada</button><button [class.selected]="type === 'SALIDA'" (click)="setType('SALIDA')"><i class="bi bi-arrow-up-right"></i> Salida</button></section>
  <section class="seller-grid"><form class="movement-form" (ngSubmit)="submit()"><h2>Nueva línea</h2><label>Producto<select name="productoId" [(ngModel)]="form.productoId" required><option value="">Selecciona un producto</option><option *ngFor="let product of products" [value]="product['id']">{{ product['sku'] }} · {{ product['nombre'] }}</option></select></label><label>Cantidad<input name="cantidad" type="number" min="1" [(ngModel)]="form.cantidad" required></label><label>Motivo <span>(opcional)</span><input name="motivo" [(ngModel)]="form.motivo" placeholder="Ej. Compra a proveedor"></label><button class="primary-action" type="submit" [disabled]="loading || !form.productoId"><i class="bi bi-plus-circle"></i> {{ loading ? 'Registrando...' : 'Registrar movimiento' }}</button></form><aside class="reference-actions"><h2>Cambiar referencia</h2><p>Los siguientes movimientos se asociarán a la referencia activa.</p><button type="button" class="advance-button" (click)="advance('ENTRADA')"><i class="bi bi-receipt"></i><span>Siguiente factura<small>Generar referencia de entrada</small></span></button><button type="button" class="advance-button ticket-button" (click)="advance('SALIDA')"><i class="bi bi-ticket-perforated"></i><span>Siguiente ticket<small>Generar referencia de salida</small></span></button></aside></section>
  <p class="success" *ngIf="message"><i class="bi bi-check-circle"></i> {{ message }}</p><p class="error" *ngIf="error"><i class="bi bi-exclamation-triangle"></i> {{ error }}</p>
</main>
