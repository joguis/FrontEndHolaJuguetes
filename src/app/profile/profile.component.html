@if (currentUser) {
<div class="container">
  <header class="jumbotron">
    <h3>
      Perfil del usuario <strong>{{ currentUser.username }}</strong>
    </h3>
  </header>
  <p>
    <strong>Correo:</strong>
    {{ currentUser.email }}
  </p>
  <strong>Roles:</strong>
  <ul>
    @for (role of currentUser.roles; track role) {
    <li>{{ role }}</li>
    }
  </ul>
</div>
} @else {
<p>Por favor debe iniciar sesión</p>
}
